server:
  port: ${PORT:8081}

spring:
  application:
    name: coderag-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:coderag}}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-seconds: ${JWT_EXPIRATION:604800} # 7 days
  cookie:
    name: coderag_token
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:${app.frontend-url:http://localhost:3000,http://localhost:8081}}
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_API_TOKEN:}
    max-repo-size-mb: ${MAX_REPO_SIZE_MB:100}
    max-file-size-mb: ${MAX_FILE_SIZE_MB:10}
  storage:
    repo-base-path: ${REPO_STORAGE_PATH:./data/repos}
  indexing:
    core-pool-size: ${INDEXING_CORE_POOL_SIZE:2}
    max-pool-size: ${INDEXING_MAX_POOL_SIZE:3}
    queue-capacity: ${INDEXING_QUEUE_CAPACITY:50}
  rate-limit:
    import-per-hour: ${RATE_LIMIT_IMPORT_PER_HOUR:5}
    chat-per-hour: ${RATE_LIMIT_CHAT_PER_HOUR:30}
    intelligence-per-hour: ${RATE_LIMIT_INTELLIGENCE_PER_HOUR:15}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:gemini-embedding-001}
    chat-model: ${CHAT_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    daily-quota: ${GEMINI_DAILY_QUOTA:1500}
    quota-enabled: ${GEMINI_QUOTA_ENABLED:true}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    collection-name: ${QDRANT_COLLECTION:code_chunks}
  hybrid-search:
    vector-weight: ${HYBRID_VECTOR_WEIGHT:0.7}
    keyword-weight: ${HYBRID_KEYWORD_WEIGHT:0.3}

